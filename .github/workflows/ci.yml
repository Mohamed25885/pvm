name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the provenance step widens it per job below.
permissions:
  contents: read

jobs:
  ci:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # build provenance (push to main only)
      attestations: write

    steps:
      # Actions are pinned to full commit SHAs (tag in the comment).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (bootstrap for FVM)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Install FVM and project SDK
        shell: pwsh
        run: |
          dart pub global activate fvm
          "$env:LOCALAPPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Single source of truth for the toolchain: .fvmrc (never hard-code).
          $flutter = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          fvm install $flutter
          fvm use $flutter --force
          fvm dart --version

      - name: Install dependencies
        run: fvm dart pub get

      - name: Check outdated packages
        run: fvm dart pub outdated

      - name: Verify formatting
        run: fvm dart format --output=none --set-exit-if-changed .

      - name: Generate version code
        run: fvm dart run build_runner build

      - name: Analyze code
        run: fvm dart analyze --fatal-infos

      - name: Run tests with coverage
        run: fvm dart test --coverage=coverage --reporter=expanded

      - name: Format coverage to LCOV
        run: |
          fvm dart pub global activate coverage
          fvm dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib,pvm.dart

      - name: Check coverage threshold
        run: |
          fvm dart pub global activate coverde
          fvm dart pub global run coverde check 60 --input coverage/lcov.info

      - name: Create Build Directory
        if: matrix.os == 'windows-latest'
        run: mkdir builds -ErrorAction SilentlyContinue

      - name: Build executable
        if: matrix.os == 'windows-latest'
        run: fvm dart compile exe pvm.dart -o builds/pvm.exe

      - name: Write SHA256SUMS
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $h = (Get-FileHash builds/pvm.exe -Algorithm SHA256).Hash.ToLower()
          "$h  pvm.exe" | Out-File -FilePath builds/SHA256SUMS -Encoding ascii
          Get-Content builds/SHA256SUMS

      - name: Attest build provenance
        if: matrix.os == 'windows-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: builds/pvm.exe

      - name: Upload Windows Binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pvm-windows
          path: |
            builds/pvm.exe
            builds/SHA256SUMS

      - name: Install test (--version)
        if: matrix.os == 'windows-latest'
        run: builds/pvm.exe --version