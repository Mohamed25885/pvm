name: pvm
description: PHP Version Manager for Windows - Switch PHP versions per-project
version: 2.1.0
repository: https://github.com/Mohamed25885/pvm
license: MIT

environment:
  sdk: ">=3.12.0 <4.0.0"

# Add regular dependencies here.
dependencies:
  args: ^2.7.0
  path: ^1.9.1
  archive: ^4.6.0 # ZIP extraction (cross-platform)
  crypto: ^3.0.8 # SHA256 verification
  http: ^1.6.0 # HTTP client
  meta: ^1.18.0 # @immutable; Flutter pins 1.18.0 (flutter-compat check)
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
  mocktail: ^1.0.5
  coverage: ^1.16.0
  build_version: ^2.2.1
  build_runner: ^2.16.1
  lint_staged: ^0.5.1
  dart_pre_commit: ^6.1.3

dart_pre_commit:
  format: true
  analyze: true
  outdated:
    level: major
  osv-scanner: true # runs only when the osv-scanner binary is on PATH; CI scans either way
  pull-up-dependencies:
    allowed:
      - meta # held at ^1.18.0 for flutter-compat (Flutter pins 1.18.0)
